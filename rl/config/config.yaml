behaviors:
  FlightAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        strength: 0.3
        demo_path: demos/PlaneAgentDemo_1.demo
    behavioral_cloning:
      demo_path: demos/PlaneAgentDemo_1.demo   # same file GAIL uses
      strength: 0.5        # how strongly BC pulls vs. the RL gradient
      steps: 0             # 0 = apply BC the whole run; or e.g. 50000 to warm-start then fade
      samples_per_update: 0
    max_steps: 600000
    time_horizon: 64
    summary_freq: 5000